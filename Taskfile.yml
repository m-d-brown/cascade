# Task (https://taskfile.dev) runner for cascade.
#
# `task precommit` is the one command to run before committing. It is what
# `.githooks/pre-commit` runs, and what CLAUDE.md and AGENTS.md point at, so a
# human, Claude, and Gemini all reach for the same gate instead of each
# remembering their own subset of `go fmt` / `go vet` / `go test`.
#
# One-time setup so the gate runs automatically on `git commit`:
#
#   task hooks:install
#
# That runs `git config core.hooksPath .githooks`, so it is not part of any
# task another task depends on. It changes repo-local git config, which is a
# decision for whoever owns the checkout to make once, not something a task
# graph should do as a side effect of testing or building.

version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format Go source files and markdown.
    cmds:
      - gofmt -w .
      - npx prettier --write "**/*.md"

  fmt:check:
    internal: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt'd:"; echo "$unformatted"; exit 1
        fi
      - npx prettier --check "**/*.md"

  vet:
    desc: Run go vet.
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...

  build:
    desc: Build every package.
    cmds:
      - go build ./...

  test:
    desc: Run the test suite with the race detector.
    cmds:
      - CGO_ENABLED=1 go test ./... -race

  tidy:
    desc: Tidy go.mod and go.sum.
    cmds:
      - go mod tidy

  api:
    desc: Update api.txt to match current exported symbols.
    cmds:
      - go generate ./internal/api

  api:check:
    internal: true
    cmds:
      - task: api
      - git diff --exit-code -- api.txt

  # The local gate: fast enough to run before every commit, and enough to
  # catch what almost always breaks review: formatting (Go and markdown),
  # vet, a build, lint, a race, and the exported API drifting from api.txt.
  # This is also everything .github/workflows/ci.yml runs.
  precommit:
    desc: Run all gates before committing (format, vet, build, lint, api, test).
    cmds:
      - task: fmt:check
      - task: vet
      - task: build
      - task: lint
      - task: api:check
      - task: test

  hooks:install:
    desc: Install git pre-commit hook.
    cmds:
      - git config core.hooksPath .githooks
      - echo "installed - git commit now runs task precommit via .githooks/pre-commit"
