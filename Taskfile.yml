# Task (https://taskfile.dev) runner for cascade.
#
# `task precommit` is the one command to run before committing. It is what
# `.githooks/pre-commit` runs, and what CLAUDE.md and AGENTS.md point at, so a
# human, Claude, and Gemini all reach for the same gate instead of each
# remembering their own subset of `go fmt` / `go vet` / `go test`.
#
# One-time setup so the gate runs automatically on `git commit`:
#
#   task hooks:install
#
# That runs `git config core.hooksPath .githooks`, so it is not part of any
# task another task depends on. It changes repo-local git config, which is a
# decision for whoever owns the checkout to make once, not something a task
# graph should do as a side effect of testing or building.

version: "3"

vars:
  GENERATE_PKGS: ./internal/api/...

tasks:
  default:
    desc: List available tasks.
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format the source tree with gofmt.
    cmds:
      - gofmt -w .

  fmt:check:
    desc: Fail if anything is not gofmt'd (what CI checks).
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt'd:"; echo "$unformatted"; exit 1
        fi

  md:fmt:
    desc: Format markdown with markdownfmt (go install github.com/Kunde21/markdownfmt/v3/cmd/markdownfmt@latest).
    cmds:
      - markdownfmt -w .

  md:fmt:check:
    desc: Fail if any markdown is not markdownfmt'd (what CI checks).
    cmds:
      - |
        unformatted=$(markdownfmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not markdownfmt'd:"; echo "$unformatted"; exit 1
        fi

  vet:
    desc: Run go vet.
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest).
    cmds:
      - golangci-lint run ./...

  build:
    desc: Build every package.
    cmds:
      - go build ./...

  test:
    desc: Run the test suite.
    cmds:
      - go test ./...

  test:race:
    desc: Run the test suite with the race detector (what CI runs; needs cgo).
    cmds:
      - CGO_ENABLED=1 go test ./... -race

  tidy:
    desc: Tidy go.mod/go.sum.
    cmds:
      - go mod tidy

  api:check:
    desc: Fail if api.txt no longer matches the exported API.
    cmds:
      - go generate {{.GENERATE_PKGS}}
      - git diff --exit-code -- api.txt

  # The local gate: fast enough to run before every commit, and enough to
  # catch what almost always breaks review: formatting (Go and markdown),
  # vet, a build, lint, a race, and the exported API drifting from api.txt.
  # This is also everything .github/workflows/ci.yml runs.
  precommit:
    desc: Run before committing. What .githooks/pre-commit runs, and what CI runs.
    cmds:
      - task: fmt:check
      - task: md:fmt:check
      - task: vet
      - task: build
      - task: lint
      - task: api:check
      - task: test:race

  ci:
    desc: Alias for precommit. Everything CI runs.
    cmds:
      - task: precommit

  hooks:install:
    desc: One-time setup - point git at .githooks so precommit runs on every commit.
    cmds:
      - git config core.hooksPath .githooks
      - echo "installed - git commit now runs task precommit via .githooks/pre-commit"
